<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1D1D1F">
<meta name="robots" content="noindex, nofollow">
<title>Binder Accounts</title>
<link rel="icon" href="https://www.binder.co.in/images/logo.png">
<link rel="stylesheet" href="/accounts-assets/app.css?v=2.3.0">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" defer></script>
</head>
<body>
<div class="admin">
  <aside class="admin-side">
    <div class="side-brand">
      <img src="https://www.binder.co.in/images/logo.png" alt="Binder" onerror="this.outerHTML='<span class=wm>Binder</span>'">
    </div>
    <div class="side-tag">Accounts</div>
    <div class="side-new"><button class="btn btn-accent sm" data-act="quickNew">+ New</button></div>
    <nav id="nav" aria-label="Accounts"></nav>
    <div class="side-foot">
      <b id="saveState">Starting…</b><span class="foot-more"><br>
      <a href="#settings" class="side-link">Settings → Backup</a><br><a href="https://www.binder.co.in/admin" class="side-link">← Binder admin</a><br><button class="side-link" data-act="signOut" style="padding:0">Sign out</button></span>
    </div>
  </aside>
  <main class="admin-main" id="main"></main>
</div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<script src="/accounts-assets/app.js?v=2.3.0"></script>
</body>
</html>
